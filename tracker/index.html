<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lindenmere, 1924</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=EB+Garamond:ital@0;1&family=IM+Fell+English+SC&family=La+Belle+Aurore&display=swap" rel="stylesheet">
<style>
:root{--verde:#24352E;--perg:#E9DFC9;--oro:#B39A70;--lluvia:#87999A;--vino:#714D4A}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;position:relative;
  color:var(--perg);font-family:'EB Garamond',Georgia,serif;
  background:radial-gradient(circle at 0 0,rgba(0,0,0,.5),transparent 420px),radial-gradient(circle at 100% 100%,rgba(0,0,0,.55),transparent 520px),linear-gradient(160deg,#2b3f36 0%,#24352E 45%,#1c2a24 100%) fixed}
/* niebla que se mueve despacio */
.fog{position:fixed;inset:-20%;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse 35% 14% at 20% 30%,rgba(225,232,226,.35),transparent 70%),
             radial-gradient(ellipse 40% 16% at 75% 70%,rgba(225,232,226,.3),transparent 70%),
             radial-gradient(ellipse 30% 12% at 55% 12%,rgba(225,232,226,.25),transparent 70%),
             radial-gradient(ellipse 45% 18% at 30% 88%,rgba(225,232,226,.28),transparent 70%);
  animation:drift 38s ease-in-out infinite;filter:blur(4px)}
.fog.b{animation-duration:55s;animation-direction:reverse;opacity:.4}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(6%)}}
main{position:relative;z-index:1;width:min(520px,100%);text-align:center;border:1px solid rgba(179,154,112,.6);outline:1px solid rgba(179,154,112,.3);outline-offset:-7px;
  padding:38px 26px 30px;background:rgba(10,16,13,.35);backdrop-filter:blur(2px);animation:in 1.6s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bird{width:92px;height:86px;margin:0 auto 10px;background:url('https://i.imgur.com/heokY6j.png') center/contain no-repeat;
  filter:drop-shadow(0 0 8px rgba(179,154,112,.4)) grayscale(.3);opacity:.85;animation:p 6s ease-in-out infinite}
@keyframes p{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.k{font-family:'IM Fell English SC',Georgia,serif;letter-spacing:3px;font-size:12px;color:var(--oro)}
h1{margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;font-size:clamp(28px,7vw,40px);line-height:1.1}
.rule{width:120px;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
p{font-size:17px;line-height:1.55;color:#d9cdb5;margin:0 0 10px}
.mano{font-family:'La Belle Aurore',cursive;color:var(--oro);font-size:19px;margin:16px 0 22px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:10px 18px;border:1px solid var(--oro);color:var(--perg);text-decoration:none;font-family:'IM Fell English SC',Georgia,serif;letter-spacing:2px;font-size:14px;transition:.25s}
a:hover,a:focus{background:var(--perg);color:var(--verde)}
</style>
</head>
<body>
<div class="fog" aria-hidden="true"></div><div class="fog b" aria-hidden="true"></div>
<main>
  <div class="bird" aria-hidden="true"></div>
  <div class="k">LINDENMERE · 1924</div>
  <h1>Todavía no estás en Lindenmere</h1>
  <div class="rule"></div>
  <p>Más allá de las colinas, la niebla no se levanta. El camino hacia el pueblo todavía no aparece en ningún mapa.</p>
  <p>Vuelve cuando el augurey cante.</p>
  <div class="mano">Mientras tanto, prepara tu mochila.</div>
  <nav>
    <a href="../creacion/">Creación de personaje</a>
    <a href="../">Volver</a>
  </nav>
</main>
</body>
</html>
